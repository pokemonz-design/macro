<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Чек-лист перед защитой бюджета</title>

<!-- Библиотека для экспорта в PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  :root {
    --teal: #2f7f82;
    --teal-dark: #1f6265;
    --black: #080808;
    --paper: #ffffff;
    --cream-dark: #ede6dc;
    --text: #202020;
    --muted: #6b6b6b;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #ffffff;
    font-family: Arial, sans-serif;
  }

  .budget-widget {
    width: 757px;
    height: 430px;
    padding: 20px 24px;
    background: var(--paper);
    border: 1px solid #e5ded4;
    color: var(--text);
    overflow-y: auto;               /* прокрутка при переполнении */
    overflow-x: hidden;
  }

  .top-label {
    display: inline-block;
    padding: 8px 18px 9px;
    margin-bottom: 12px;
    background: var(--teal);
    color: #ffffff;
    font-family: Arial, sans-serif; /* без засечек */
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
  }

  h1 {
    margin: 0 0 7px;
    font-family: Arial, sans-serif; /* без засечек */
    font-size: 23px;
    line-height: 1.05;
    color: var(--black);
    letter-spacing: -0.4px;
  }

  .intro {
    margin: 0 0 11px;
    max-width: 690px;
    font-size: 14px;
    line-height: 1.35;
    color: #333333;
    font-family: Arial, sans-serif;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .progress-text {
    width: 112px;
    font-size: 13px;
    font-weight: 700;
    color: var(--teal-dark);
    font-family: Arial, sans-serif;
  }

  .progress-bar {
    flex: 1;
    height: 10px;
    background: var(--cream-dark);
    border-radius: 20px;
    overflow: hidden;
  }

  .progress-fill {
    width: 0%;
    height: 100%;
    background: var(--teal);
    border-radius: 20px;
    transition: width 0.25s ease;
  }

  .checklist {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px 10px;
    margin-bottom: 13px;
  }

  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    min-height: 52px;
    padding: 8px 9px;
    background: #fbfaf7;
    border: 1px solid #ded7cd;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .check-item:hover {
    background: #f2fafa;
    border-color: var(--teal);
  }

  .check-item input {
    width: 16px;
    height: 16px;
    margin-top: 1px;
    accent-color: var(--teal);
    cursor: pointer;
    flex: 0 0 auto;
  }

  .check-text {
    font-size: 15px;                 /* увеличено с 12.6px на ~15% */
    line-height: 1.22;
    font-family: Arial, sans-serif;
  }

  .check-item.checked {
    background: #eaf6f6;
    border-color: var(--teal);
  }

  .check-item.checked .check-text {
    color: var(--teal-dark);
    font-weight: 700;
  }

  .buttons {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  button {
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s ease;
    font-family: Arial, sans-serif;
  }

  .download-btn {
    border: 1px solid var(--teal);
    background: var(--teal);
    color: #ffffff;
  }

  .download-btn:hover {
    background: var(--teal-dark);
  }

  .print-btn {
    border: 1px solid var(--teal);
    background: #ffffff;
    color: var(--teal-dark);
  }

  .print-btn:hover {
    background: #f2fafa;
  }

  .result-note {
    margin-left: auto;
    font-size: 12.5px;
    color: var(--muted);
    text-align: right;
    font-family: Arial, sans-serif;
  }

  @media print {
    body * {
      visibility: hidden;
    }

    .budget-widget,
    .budget-widget * {
      visibility: visible;
    }

    .budget-widget {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: auto;
      border: none;
      overflow: visible;
    }

    .buttons {
      display: none;
    }
  }
</style>
</head>

<body>

<div class="budget-widget" id="budgetChecklist">
  <div class="top-label">Бюджет-2027</div>

  <h1>Что проверить перед защитой бюджета</h1>

  <p class="intro">
    Отметьте, что вы уже проверили в бюджетной модели
  </p>

  <div class="progress-row">
    <div class="progress-text" id="progressText">Готово: 0 из 9</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="checklist">
    <label class="check-item">
      <input type="checkbox" value="Курс, ставка, инфляция и спрос заложены в базовом и стрессовом сценариях">
      <span class="check-text">Курс, ставка, инфляция и спрос заложены в базовом и стрессовом сценариях</span>
    </label>

    <label class="check-item">
      <input type="checkbox" value="Импортные закупки и валютные платежи пересчитаны по стресс-курсу">
      <span class="check-text">Импортные закупки и валютные платежи пересчитаны по стресс-курсу</span>
    </label>

    <label class="check-item">
      <input type="checkbox" value="Проценты по кредитам, лизингу и факторингу пересчитаны при росте ставки">
      <span class="check-text">Проценты по кредитам, лизингу и факторингу пересчитаны при росте ставки</span>
    </label>

    <label class="check-item">
      <input type="checkbox" value="ФОТ проверен: индексация, премии, найм и страховые взносы учтены">
      <span class="check-text">ФОТ проверен: индексация, премии, найм и страховые взносы учтены</span>
    </label>

    <label class="check-item">
      <input type="checkbox" value="Инвестпроекты разделены на обязательные и те, которые можно перенести">
      <span class="check-text">Инвестпроекты разделены на обязательные и те, которые можно перенести</span>
    </label>

    <label class="check-item">
      <input type="checkbox" value="Запасы, дебиторка, кредиторка и авансы пересчитаны под новый сценарий">
      <span class="check-text">Запасы, дебиторка, кредиторка и авансы пересчитаны для стрессового сценария</span>
    </label>

    <label class="check-item">
      <input type="checkbox" value="Налоги, сборы, пошлины и риск доначислений проверены">
      <span class="check-text">Налоги, сборы, пошлины и риск доначислений проверены</span>
    </label>

    <label class="check-item">
      <input type="checkbox" value="Проверено, хватит ли денег на платежи при кассовом разрыве">
      <span class="check-text">Проверено, хватит ли денег на платежи при кассовом разрыве</span>
    </label>

    <label class="check-item">
      <input type="checkbox" value="Заданы пороги, при которых бюджет нужно пересчитать">
      <span class="check-text">Заданы пороги, при которых бюджет нужно пересчитать</span>
    </label>
  </div>

  <div class="buttons">
    <button class="download-btn" onclick="savePdf()">
      Сохранить в PDF
    </button>

    <button class="print-btn" onclick="window.print()">
      Распечатать
    </button>

    <div class="result-note" id="resultNote">Проверьте все 9 пунктов</div>
  </div>
</div>

<script>
  const checkboxes = document.querySelectorAll('.check-item input');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const resultNote = document.getElementById('resultNote');

  function updateProgress() {
    const total = checkboxes.length;
    const checked = document.querySelectorAll('.check-item input:checked').length;
    const percent = Math.round((checked / total) * 100);

    progressFill.style.width = percent + '%';
    progressText.textContent = 'Готово: ' + checked + ' из ' + total;

    checkboxes.forEach(function(box) {
      box.closest('.check-item').classList.toggle('checked', box.checked);
    });

    if (checked === total) {
      resultNote.textContent = 'Бюджет готов к защите';
    } else if (checked >= 6) {
      resultNote.textContent = 'Осталось закрыть слабые места';
    } else if (checked >= 3) {
      resultNote.textContent = 'Нужен дополнительный стресс-тест';
    } else {
      resultNote.textContent = 'Проверьте все 9 пунктов';
    }
  }

  checkboxes.forEach(function(box) {
    box.addEventListener('change', updateProgress);
  });

  async function savePdf() {
    const element = document.getElementById('budgetChecklist');
    const buttons = element.querySelector('.buttons');

    if (typeof html2pdf === 'undefined') {
      alert('Не удалось загрузить библиотеку для PDF. Проверьте интернет-соединение.');
      return;
    }

    const originalHeight = element.style.height;
    const originalOverflow = element.style.overflow;
    const originalButtonsDisplay = buttons.style.display;

    buttons.style.display = 'none';
    element.style.height = 'auto';
    element.style.overflow = 'visible';

    const options = {
      margin: 0,
      filename: 'checklist_budget_2027.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff'
      },
      jsPDF: {
        unit: 'mm',
        format: 'a4',
        orientation: 'portrait'
      },
      exclude: ['.buttons']
    };

    try {
      await html2pdf().set(options).from(element).save();
    } catch (error) {
      console.error(error);
      alert('Не удалось сохранить PDF.');
    } finally {
      buttons.style.display = originalButtonsDisplay;
      element.style.height = originalHeight;
      element.style.overflow = originalOverflow;
    }
  }

  updateProgress();
</script>

</body>
</html>
